<div style="display: flex; flex-direction: column; width: 393px; height: 852px; background: var(--background, #0F172A); border-radius: 36px; overflow: hidden; font-family: Inter, -apple-system, sans-serif;">

  <!-- ═══════════════════════════════════════════════════════
       SCROLLABLE MAIN CONTENT (flex: 1)
  ═══════════════════════════════════════════════════════ -->
  <div style="display: flex; flex-direction: column; flex: 1; padding: 24px 24px 16px 24px; gap: 20px; background: var(--background, #0F172A); overflow-y: auto; align-self: stretch;">

    <!-- ── HEADER: Title + Settings Icon ── -->
    <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; align-self: stretch; padding-top: 8px;">
      <!-- PureLoop Heading Token: 24px SemiBold (600) -->
      <span style="color: var(--foreground, #FFFFFF); font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">My Cards</span>
      <div style="display: flex; width: 40px; height: 40px; background: var(--card, #1E293B); border-radius: 999px; justify-content: center; align-items: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>

    <!-- ── VIRTUAL DEBIT CARD ── -->
    <div style="display: flex; flex-direction: column; height: 210px; background: linear-gradient(135deg, #4F46E5 0%, #1E1B4B 100%); border-radius: 20px; padding: 22px 24px; justify-content: space-between; position: relative; overflow: hidden; align-self: stretch;">
      
      <!-- Top Row: Bank Info + Zap Icon -->
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start; align-self: stretch;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <!-- PureLoop Micro-label Token: 10px Medium (500) Uppercase -->
          <span style="color: rgba(255, 255, 255, 0.8); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;">NOVA BANK SIGNATURE</span>
          <!-- PureLoop Subheading Token: 18px SemiBold (600) -->
          <span style="color: #FFFFFF; font-size: 18px; font-weight: 600;">Debit Card</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
      </div>

      <!-- Middle Row: Card Number + Eye Toggle (18px SemiBold 600) -->
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; align-self: stretch; gap: 12px;">
        <span style="color: #FFFFFF; font-size: 18px; font-weight: 600; font-family: Inter, monospace; letter-spacing: 0.14em; flex: 1; white-space: nowrap;">•••• •••• •••• 6789</span>
        <div style="display: flex; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.18); border-radius: 999px; justify-content: center; align-items: center; flex-shrink: 0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>

      <!-- Bottom Row: Card Holder, Valid Thru, CVV (14px Regular 400) -->
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: flex-end; align-self: stretch;">
        <!-- Holder -->
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="color: rgba(255, 255, 255, 0.65); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;">CARD HOLDER</span>
          <span style="color: #FFFFFF; font-size: 14px; font-weight: 400; letter-spacing: 0.05em;">ALEX DOE</span>
        </div>
        <!-- Valid Thru -->
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: center;">
          <span style="color: rgba(255, 255, 255, 0.65); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;">VALID THRU</span>
          <span style="color: #FFFFFF; font-size: 14px; font-weight: 400;">12/28</span>
        </div>
        <!-- CVV -->
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
          <span style="color: rgba(255, 255, 255, 0.65); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;">CVV</span>
          <span style="color: #FFFFFF; font-size: 14px; font-weight: 400; letter-spacing: 0.12em;">•••</span>
        </div>
      </div>

    </div>

    <!-- ── CARD CONTROL BUTTONS (Copy Details & Lock Card) ── -->
    <div style="display: flex; flex-direction: row; gap: 16px; align-self: stretch;">
      <!-- Copy Details -->
      <div style="display: flex; flex-direction: column; flex: 1; padding: 18px; background: var(--card, #1E293B); border-radius: 20px; justify-content: center; align-items: center; gap: 10px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent, #818CF8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span style="color: var(--muted-foreground, #9CA3AF); font-size: 14px; font-weight: 400; text-align: center;">Copy Details</span>
      </div>
      <!-- Lock Card -->
      <div style="display: flex; flex-direction: column; flex: 1; padding: 18px; background: var(--card, #1E293B); border-radius: 20px; justify-content: center; align-items: center; gap: 10px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--destructive, #EF4444)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="color: var(--muted-foreground, #9CA3AF); font-size: 14px; font-weight: 400; text-align: center;">Lock Card</span>
      </div>
    </div>

    <!-- ── SETTINGS & LIMITS CONTAINER ── -->
    <div style="display: flex; flex-direction: column; padding: 20px; background: rgba(30, 41, 59, 0.4); border-radius: 24px; border-width: 1px; border-color: var(--border, rgba(51, 65, 85, 0.5)); gap: 16px; align-self: stretch;">
      
      <!-- Option 1: Online Transactions (Enabled) -->
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; align-self: stretch;">
        <div style="display: flex; flex-direction: row; gap: 12px; align-items: center;">
          <div style="display: flex; width: 40px; height: 40px; background: rgba(59, 130, 246, 0.2); border-radius: 999px; justify-content: center; align-items: center; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="color: var(--foreground, #FFFFFF); font-size: 14px; font-weight: 600; white-space: nowrap;">Online Transactions</span>
            <!-- Micro-label rule: 10px Medium (500) -->
            <span style="color: var(--muted-foreground, #9CA3AF); font-size: 10px; font-weight: 500; white-space: nowrap;">Enabled for this card</span>
          </div>
        </div>
        <!-- Active Switch (24px Height) -->
        <div style="display: flex; width: 44px; height: 24px; background: var(--primary, #4F46E5); border-radius: 999px; padding: 2px; justify-content: flex-end; align-items: center; flex-shrink: 0;">
          <div style="width: 20px; height: 20px; background: #FFFFFF; border-radius: 999px;"></div>
        </div>
      </div>

      <!-- Divider -->
      <div style="height: 1px; background: var(--border, rgba(51, 65, 85, 0.4)); align-self: stretch;"></div>

      <!-- Option 2: International Usage (Disabled) -->
      <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; align-self: stretch;">
        <div style="display: flex; flex-direction: row; gap: 12px; align-items: center;">
          <div style="display: flex; width: 40px; height: 40px; background: rgba(168, 85, 247, 0.2); border-radius: 999px; justify-content: center; align-items: center; flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="color: var(--foreground, #FFFFFF); font-size: 14px; font-weight: 600; white-space: nowrap;">International Usage</span>
            <!-- Micro-label rule: 10px Medium (500) -->
            <span style="color: var(--muted-foreground, #9CA3AF); font-size: 10px; font-weight: 500; white-space: nowrap;">Disabled for security</span>
          </div>
        </div>
        <!-- Inactive Switch (24px Height) -->
        <div style="display: flex; width: 44px; height: 24px; background: var(--background, #0F172A); border-radius: 999px; border-width: 1px; border-color: #334155; padding: 2px; justify-content: flex-start; align-items: center; flex-shrink: 0;">
          <div style="width: 18px; height: 18px; background: #9CA3AF; border-radius: 999px;"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       FIXED BOTTOM NAVIGATION WITH FLOATING SCANNER FAB
  ═══════════════════════════════════════════════════════ -->
  <div style="display: flex; flex-direction: row; justify-content: space-around; align-items: center; height: 76px; background: rgba(15, 23, 42, 0.85); border-top-width: 1px; border-top-color: var(--border, rgba(30, 41, 59, 0.5)); align-self: stretch; padding: 0 24px 12px 24px; position: relative;">

    <!-- Home (Inactive) -->
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; flex: 1;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground, #9CA3AF)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M18 12h.01"/><rect width="6" height="8" x="16" y="8" rx="1"/></svg>
      <span style="color: var(--muted-foreground, #9CA3AF); font-size: 14px; font-weight: 400; text-align: center;">Home</span>
    </div>

    <!-- History (Inactive) -->
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; flex: 1;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground, #9CA3AF)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="color: var(--muted-foreground, #9CA3AF); font-size: 14px; font-weight: 400; text-align: center;">History</span>
    </div>

    <!-- CENTER FLOATING FAB (Scan) -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; position: relative;">
      <div id="scan-btn" style="display: flex; width: 56px; height: 56px; background: var(--primary, #4F46E5); border-radius: 999px; justify-content: center; align-items: center; position: absolute; top: -24px; left: calc(50% - 28px);">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
    </div>

    <!-- Cards (Active) -->
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; flex: 1;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary, #4F46E5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      <span style="color: var(--primary, #4F46E5); font-size: 14px; font-weight: 400; text-align: center;">Cards</span>
    </div>

    <!-- Profile (Inactive) -->
    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; flex: 1;">
      <div style="display: flex; width: 24px; height: 24px; background: var(--primary, #4F46E5); border-radius: 999px; border-width: 1px; border-color: #9CA3AF; justify-content: center; align-items: center;">
        <span style="color: #FFFFFF; font-size: 10px; font-weight: 700;">A</span>
      </div>
      <span style="color: var(--muted-foreground, #9CA3AF); font-size: 14px; font-weight: 400; text-align: center;">Profile</span>
    </div>

  </div>

</div>
